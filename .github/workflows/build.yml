name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: Runout-windows-x64.zip
          - name: macOS (Apple Silicon)
            os: macos-latest
            asset: Runout-macos-arm64.zip
          - name: Linux
            # la distribución más antigua disponible: el binario depende de su glibc
            os: ubuntu-22.04
            asset: Runout-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Librerías del sistema para Qt (Linux)
        # las pruebas de la interfaz crean la ventana con Qt (sin pantalla, plataforma offscreen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import runout; print(runout.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con __version__ = $version"
            exit 1
          fi

      - name: Pruebas
        run: python -m pytest -q

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm --clean runout.spec

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Runout.exe -DestinationPath ${{ matrix.asset }}

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Runout.app ${{ matrix.asset }}

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist Runout

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publicar en Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
